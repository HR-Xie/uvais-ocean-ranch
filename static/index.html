<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UVAIS — 海洋牧场智能调度系统</title>
<style>
:root {
  --deep: #0A1628; --navy: #0D2B4A; --ocean: #0D6E8F; --teal: #0A8FAB;
  --ice: #C4DCE8; --foam: #DEE8F2; --mist: #E8F0F6; --white: #F4F8FB;
  --coral: #E05A4A; --amber: #E8A840; --green: #2ECC71;
  --shadow: 0 2px 16px rgba(10, 22, 40, 0.12);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: linear-gradient(160deg, #0A1628 0%, #0D2B4A 40%, #0F3A5C 100%);
  color: #D0DDE8; height: 100vh; display: flex; flex-direction: column;
  overflow: hidden;
}

/* ── Wave Header ──────────────────────────────────────────────────── */
.header {
  position: relative; background: linear-gradient(135deg, #0D6E8F, #0A8FAB);
  padding: 14px 28px; display: flex; align-items: center; gap: 14px;
  z-index: 10; box-shadow: 0 2px 24px rgba(0,0,0,0.3);
}
.header-logo { font-size: 1.3rem; }
.header h1 { font-size: 1.05rem; font-weight: 700; color: #fff; letter-spacing: 1px; }
.header-tag { font-size: 0.7rem; color: rgba(255,255,255,0.7); margin-left: 4px; }
.header-status { margin-left: auto; display: flex; gap: 16px; align-items: center; }
.status-badge {
  font-size: 0.75rem; padding: 4px 12px; border-radius: 20px;
  display: flex; align-items: center; gap: 6px;
}
.status-badge.online { background: rgba(46,204,113,0.2); color: #2ECC71; border: 1px solid rgba(46,204,113,0.3); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.status-dot.online { background: #2ECC71; box-shadow: 0 0 8px rgba(46,204,113,0.6); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── Wave Canvas ──────────────────────────────────────────────────── */
#wave-canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 40px; opacity: 0.25; }

/* ── Layout ───────────────────────────────────────────────────────── */
.main { flex: 1; display: flex; overflow: hidden; position: relative; }

/* Sidebar */
.sidebar {
  width: 260px; background: rgba(13, 43, 74, 0.6); backdrop-filter: blur(12px);
  border-right: 1px solid rgba(255,255,255,0.06); padding: 20px 16px;
  display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
}
.sidebar-section { margin-bottom: 4px; }
.sidebar-label {
  font-size: 0.68rem; text-transform: uppercase; letter-spacing: 2px;
  color: rgba(255,255,255,0.35); margin-bottom: 8px; padding-left: 4px;
}
.role-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px;
  border: 1.5px solid rgba(255,255,255,0.08); border-radius: 10px;
  background: transparent; cursor: pointer; text-align: left;
  font-size: 0.88rem; color: rgba(255,255,255,0.7); margin-bottom: 4px;
  transition: all 0.2s;
}
.role-btn:hover { border-color: rgba(10,143,171,0.5); background: rgba(10,143,171,0.1); color: #fff; }
.role-btn.active { border-color: #0A8FAB; background: rgba(10,143,171,0.18); color: #fff; font-weight: 600; }
.role-icon { font-size: 1.1rem; }

.quick-btn {
  display: block; width: 100%; padding: 8px 14px; margin-bottom: 4px;
  border: 1px solid rgba(255,255,255,0.06); border-radius: 20px;
  background: rgba(255,255,255,0.03); cursor: pointer;
  font-size: 0.8rem; color: rgba(255,255,255,0.55); text-align: left;
  transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.quick-btn:hover { background: rgba(10,143,171,0.15); color: #fff; border-color: rgba(10,143,171,0.3); }

/* Chat area */
.chat-area { flex: 1; display: flex; flex-direction: column; background: rgba(10,22,40,0.3); }
.messages {
  flex: 1; overflow-y: auto; padding: 28px 36px;
  display: flex; flex-direction: column; gap: 14px;
}
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

/* Message bubbles */
.msg { max-width: 72%; padding: 12px 18px; border-radius: 14px; font-size: 0.9rem; line-height: 1.7; animation: msgIn 0.35s ease-out; word-break: break-word; }
@keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.msg.user {
  align-self: flex-end; background: rgba(10,143,171,0.2);
  border: 1px solid rgba(10,143,171,0.3); color: #C8E6F0;
  border-radius: 16px 4px 16px 16px;
}
.msg.assistant {
  align-self: flex-start; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08); color: #D0DDE8;
  border-radius: 4px 16px 16px 16px;
}
.msg.error { align-self: center; background: rgba(224,90,74,0.15); border: 1px solid rgba(224,90,74,0.3); color: #F08070; }
.msg.assistant h1,.msg.assistant h2,.msg.assistant h3 { color: #7DD8F0; margin: 8px 0 4px; font-size: 1rem; }
.msg.assistant strong { color: #8BE0F8; }
.msg.assistant table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 0.85rem; }
.msg.assistant th { background: rgba(10,143,171,0.3); color: #8BE0F8; padding: 6px 10px; text-align: left; font-weight: 600; }
.msg.assistant td { padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.msg.assistant code { background: rgba(10,143,171,0.2); padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
.msg.assistant hr { border: none; height: 1px; background: rgba(255,255,255,0.1); margin: 10px 0; }
.msg.assistant ul, .msg.assistant ol { padding-left: 20px; margin: 4px 0; }

/* Typing cursor */
.typing-cursor::after { content: "▊"; animation: blink 0.8s infinite; color: #0A8FAB; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Work order card */
.wo-card {
  margin-top: 8px; padding: 12px 16px; background: rgba(10,143,171,0.08);
  border: 1px solid rgba(10,143,171,0.2); border-radius: 10px;
}
.wo-download {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 8px;
  padding: 6px 16px; background: #0D6E8F; color: #fff; border: none;
  border-radius: 6px; cursor: pointer; font-size: 0.82rem; transition: background 0.2s;
}
.wo-download:hover { background: #0A8FAB; }

/* Welcome screen */
.welcome {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; gap: 12px; animation: msgIn 0.6s ease-out;
}
.welcome-icon { font-size: 3.5rem; }
.welcome h2 { font-size: 1.4rem; color: #fff; font-weight: 600; }
.welcome p { color: rgba(255,255,255,0.5); font-size: 0.9rem; max-width: 380px; }

/* Input bar */
.input-bar {
  padding: 14px 36px 18px; background: rgba(13,43,74,0.7);
  backdrop-filter: blur(16px); border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; gap: 10px; align-items: center;
}
.input-bar input {
  flex: 1; padding: 11px 18px; border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 24px; font-size: 0.9rem; outline: none; color: #D0DDE8;
  background: rgba(255,255,255,0.05); transition: border-color 0.2s;
}
.input-bar input::placeholder { color: rgba(255,255,255,0.25); }
.input-bar input:focus { border-color: #0A8FAB; background: rgba(255,255,255,0.08); }
.send-btn {
  width: 42px; height: 42px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, #0D6E8F, #0A8FAB); color: #fff;
  font-size: 1.1rem; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.send-btn:hover { transform: scale(1.05); box-shadow: 0 0 16px rgba(10,143,171,0.4); }
.send-btn:disabled { opacity: 0.4; transform: none; cursor: not-allowed; box-shadow: none; }

/* Loading dots */
.loading { display: flex; gap: 4px; padding: 8px 0; }
.loading span { width: 6px; height: 6px; border-radius: 50%; background: #0A8FAB; animation: bounce 1.2s infinite; }
.loading span:nth-child(2) { animation-delay: 0.2s; }
.loading span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{opacity:0.2;transform:translateY(0)} 40%{opacity:1;transform:translateY(-6px)} }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .messages { padding: 16px; }
  .msg { max-width: 90%; }
}
</style>
</head>
<body>

<header class="header">
  <span class="header-logo">🌊</span>
  <h1>UVAIS</h1>
  <span class="header-tag">海洋牧场智能调度</span>
  <div class="header-status">
    <span class="status-badge online"><span class="status-dot online"></span>Agent</span>
    <span class="status-badge online" id="milvus-badge"><span class="status-dot online"></span>Milvus</span>
  </div>
</header>

<div class="main">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">角色切换</div>
      <button class="role-btn active" data-role="manager">
        <span class="role-icon">🏗️</span> 总控人员
      </button>
      <button class="role-btn" data-role="worker">
        <span class="role-icon">🔧</span> 水下作业人员
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">快捷指令</div>
      <div id="quick-btns"></div>
    </div>

    <div class="sidebar-section" style="margin-top:auto;">
      <div class="sidebar-label">信息</div>
      <div style="font-size:0.72rem;color:rgba(255,255,255,0.3);line-height:1.6;">
        模型: DeepSeek v4-pro<br>
        知识库: 10 篇 / 59 节点<br>
        工具: 5 functions
      </div>
    </div>
  </aside>

  <!-- Chat -->
  <section class="chat-area">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🏗️</div>
        <h2>总控调度中心</h2>
        <p>输入任务需求或点击左侧快捷指令开始调度</p>
      </div>
    </div>

    <div class="input-bar">
      <input type="text" id="prompt" placeholder="输入指令, Enter 发送..." autofocus>
      <button class="send-btn" id="send-btn" onclick="doSend()" title="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </section>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────
let role = "manager";
let history = [];
let isStreaming = false;

const $msgs = document.getElementById("messages");
const $input = document.getElementById("prompt");
const $sendBtn = document.getElementById("send-btn");
const $welcome = document.getElementById("welcome");

// ── Quick actions ────────────────────────────────────────────────────
const QUICK = {
  manager: [
    ["🌊 查询B区海况", "查询B区实时海况"],
    ["📋 派发巡检工单", "派发网箱巡检工单"],
    ["🔍 视觉检测", "检查水下摄像头img_001的画面"],
    ["📄 安全报告", "生成周度安全报告"],
  ],
  worker: [
    ["📍 定位与测距", "获取当前位置与测距"],
    ["🌊 海况查询", "查询当前海况是否安全"],
    ["📖 SOP 查阅", "查阅ROV巡检操作规程"],
    ["⚠️ 紧急撤离", "当前海况异常请求紧急撤离"],
  ],
};

function renderQuickActions() {
  const container = document.getElementById("quick-btns");
  container.innerHTML = "";
  QUICK[role].forEach(([label, query]) => {
    const btn = document.createElement("button");
    btn.className = "quick-btn";
    btn.textContent = label;
    btn.onclick = () => { $input.value = query; doSend(); };
    container.appendChild(btn);
  });
}
renderQuickActions();

// ── Role switching ───────────────────────────────────────────────────
document.querySelectorAll(".role-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".role-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    role = btn.dataset.role;
    history = [];
    $msgs.innerHTML = "";
    $welcome && $welcome.remove();
    renderQuickActions();
    showWelcome();
  });
});

// ── Messages ─────────────────────────────────────────────────────────
function addMsg(kind, html = false) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  $msgs.appendChild(div);
  scrollDown();
  return div;
}

function scrollDown() {
  requestAnimationFrame(() => {
    $msgs.scrollTop = $msgs.scrollHeight;
  });
}

function showWelcome() {
  if ($msgs.children.length > 0) return;
  const w = document.createElement("div");
  w.className = "welcome";
  w.id = "welcome";
  w.innerHTML = role === "manager"
    ? '<div class="welcome-icon">🏗️</div><h2>总控调度中心</h2><p>环境评估 · 安全联锁 · 派单审批 · 工单生成</p>'
    : '<div class="welcome-icon">🔧</div><h2>水下作业终端</h2><p>自动定位 · 海况预警 · SOP 要点 · 紧急撤离</p>';
  $msgs.appendChild(w);
}

// ── Markdown rendering (lightweight) ──────────────────────────────────
function renderMD(text) {
  if (!text) return "";
  let html = text
    // Bold
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    // Italic
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    // Inline code
    .replace(/`(.+?)`/g, "<code>$1</code>")
    // Headers
    .replace(/^### (.+)$/gm, "<h3>$1</h3>")
    .replace(/^## (.+)$/gm, "<h2>$1</h2>")
    .replace(/^# (.+)$/gm, "<h1>$1</h1>")
    // Horizontal rules
    .replace(/^---$/gm, "<hr>")
    // Unordered lists
    .replace(/^- (.+)$/gm, "<li>$1</li>")
    // Bold list items
    .replace(/<li><strong>(.+?)<\/strong>(.*?)<\/li>/g, "<li><strong>$1</strong>$2</li>")
    // Wrap consecutive <li> in <ul>
    ;

  // Table rendering
  const lines = html.split("\n");
  let result = [];
  let inTable = false;
  let tableRows = [];
  let headerDone = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith("|") && line.endsWith("|")) {
      if (line.match(/^[\|\s\-:]+$/)) { headerDone = true; continue; }
      const cells = line.slice(1, -1).split("|").map(c => c.trim());
      if (!inTable) {
        inTable = true;
        tableRows = [];
        headerDone = false;
      }
      tableRows.push({ cells, isHeader: !headerDone });
      if (!headerDone) headerDone = true;
      continue;
    }
    if (inTable && tableRows.length > 0) {
      let tbl = "<table>";
      tableRows.forEach((row, ri) => {
        tbl += "<tr>";
        row.cells.forEach(cell => {
          tbl += row.isHeader && ri === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
        });
        tbl += "</tr>";
      });
      tbl += "</table>";
      result.push(tbl);
      tableRows = [];
      inTable = false;
    }
    // Group consecutive list items
    if (line.startsWith("<li>")) {
      result.push("<ul>" + line);
      while (i + 1 < lines.length && lines[i + 1].trim().startsWith("<li>")) {
        i++;
        result.push(lines[i].trim());
      }
      result.push("</ul>");
    } else {
      result.push(line);
    }
  }
  // Flush remaining table
  if (inTable && tableRows.length > 0) {
    let tbl = "<table>";
    tableRows.forEach((row, ri) => {
      tbl += "<tr>";
      row.cells.forEach(cell => {
        tbl += row.isHeader && ri === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
      });
      tbl += "</tr>";
    });
    tbl += "</table>";
    result.push(tbl);
  }

  return result.join("\n").replace(/\n/g, "<br>");
}

// ── Work order detection + download button ────────────────────────────
function injectWorkOrder(el, text) {
  if (text.includes("工单编号") || text.includes("自动化处置工单")) {
    const match = text.match(/WO-[\d-]+/);
    const woId = match ? match[0] : "workorder";
    const wrap = document.createElement("div");
    wrap.className = "wo-card";
    wrap.innerHTML = `<span style="color:#8BE0F8;font-size:0.8rem;">📋 工单已生成</span>`;
    const btn = document.createElement("button");
    btn.className = "wo-download";
    btn.textContent = "📥 下载 PDF";
    btn.onclick = () => downloadPDF(text, woId);
    wrap.appendChild(btn);
    el.appendChild(wrap);
  }
}

function downloadPDF(mdText, filename) {
  // Generate simple PDF-wrapped markdown
  const blob = new Blob([mdText], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${filename}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── Send ──────────────────────────────────────────────────────────────
async function doSend() {
  if (isStreaming) return;
  const q = $input.value.trim();
  if (!q) return;

  $input.value = "";
  isStreaming = true;
  $sendBtn.disabled = true;

  // Remove welcome
  const w = document.getElementById("welcome");
  if (w) w.remove();

  // User msg
  const userDiv = addMsg("user");
  userDiv.textContent = q;

  // Assistant msg with loading
  const asstDiv = addMsg("assistant");
  const loader = document.createElement("div");
  loader.className = "loading";
  loader.innerHTML = "<span></span><span></span><span></span>";
  asstDiv.appendChild(loader);

  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: q, history, role }),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let content = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        if (part.startsWith("data: ")) {
          try {
            const data = JSON.parse(part.slice(6));
            content += data.content;
            asstDiv.innerHTML = renderMD(content);
            asstDiv.classList.add("typing-cursor");
            scrollDown();
          } catch (e) {}
        }
      }
    }
    // Flush remaining
    if (buf.trim() && buf.trim().startsWith("data: ")) {
      try {
        const data = JSON.parse(buf.trim().slice(6));
        content += data.content;
      } catch (e) {}
    }

    asstDiv.classList.remove("typing-cursor");
    if (!content.trim()) {
      asstDiv.textContent = "（Agent 未返回内容，请重试）";
    } else {
      asstDiv.innerHTML = renderMD(content);
      injectWorkOrder(asstDiv, content);
    }

    history.push({ role: "user", content: q });
    history.push({ role: "assistant", content });
  } catch (e) {
    asstDiv.classList.remove("typing-cursor");
    asstDiv.classList.add("error");
    asstDiv.textContent = "连接失败: " + e.message + "。请确认后端服务已启动。";
  } finally {
    isStreaming = false;
    $sendBtn.disabled = false;
    $input.focus();
  }
}

// ── Enter to send ─────────────────────────────────────────────────────
$input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); } });

// ── Health check ──────────────────────────────────────────────────────
async function healthCheck() {
  try {
    const r = await fetch("/health");
    if (r.ok) {
      document.querySelectorAll(".status-badge").forEach(b => b.className = "status-badge online");
    }
  } catch (e) {
    document.getElementById("milvus-badge").className = "status-badge";
    document.getElementById("milvus-badge").style.color = "#E05A4A";
  }
}
healthCheck();
setInterval(healthCheck, 30000);
</script>
</body>
</html>
